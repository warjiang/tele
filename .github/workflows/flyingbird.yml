name: Generate flyingbird-clash rules
run-name: ${{ github.actor }} is trigger generation 🚀
on: 
  push:
  schedule:
    - cron: '0 */1 * * *'
jobs:
  generate-flyingbird-clash-rules:
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Setup AWS CLI Action
        uses: warjiang/setup-awscli-action@v0.1.1
      - name: Setup AWS config
        run: |
          mkdir -p ~/.aws
          echo "${{ secrets.AWS_CREDENTIALS }}" > ~/.aws/credentials
          echo "${{ secrets.AWS_CONFIG }}" > ~/.aws/config
          mkdir -p dist
      - name: Test AWS config
        run: |
          aws --version
          aws --profile qiniu s3 ls
      - name: Generate And Upload Rules
        run: |
          SHELL_FOLDER=$(pwd)
          SUBSCRIBE_LINK="${{ secrets.FLYINGBIRD_SUBSCRIBE_LINK }}"
          IFS='#' read -r -a array <<< "$SUBSCRIBE_LINK"
          subscribe_link=${array[0]}
          profile=${array[1]}
          target_path=${array[2]}
          cdn_url=${array[3]}
          if [ -z "$cdn_url" ]; then
            echo "cdn_url is not set in FLYINGBIRD_SUBSCRIBE_LINK (expected format: subscribe_link#profile#s3_target_path#cdn_url)"
            exit 1
          fi
          wget -q "$subscribe_link" -O clash.yaml
          aws --profile ${profile} s3 cp --acl public-read ./clash.yaml ${target_path}
          node refresh.js $cdn_url
        env:
          QINIU_ACCESS_KEY: ${{ secrets.QINIU_ACCESS_KEY }}
          QINIU_SECRET_KEY: ${{ secrets.QINIU_SECRET_KEY }}
