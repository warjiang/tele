name: Generate clash rules(mixed)
run-name: ${{ github.actor }} is trigger generation 🚀
on: 
  push:
  schedule:
    - cron: '0 */1 * * *'
jobs:
  generate-clash-rules:
    runs-on: ubuntu-latest
    services:
      subconverter:
        image: tindy2013/subconverter:0.8.1
        ports:
          # Opens tcp port 6379 on the host and service container
          - 25500:25500
        options: >-
          --health-cmd "nc -v -z -w 5 127.0.0.1 25500"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Setup AWS Cli Action
        uses: warjiang/setup-awscli-action@v0.1.1
      - name: Setup AWS config
        run: |
          mkdir -p ~/.aws
          echo "${{ vars.AWS_CREDENTIALS }}" > ~/.aws/credentials
          echo "${{ vars.AWS_CONFIG }}" > ~/.aws/config
          mkdir -p dist
      - name: Test Aws config
        run: |
          aws --version
          aws --profile stardream s3 ls
          aws --profile qiniu s3 ls
      - name: Install dependencies
        run: npm ci
      - name: Generate And Upload Rules
        run: |
          SHELL_FOLDER=$(pwd)
          subscribes=$(cat $SHELL_FOLDER/subscribes.list | grep -v '^\s*$' | grep -v '^#')
          for line in $subscribes; do
              echo "Processing $line"
              IFS='#' read -r -a array <<< "$line"
              subscribe_link=${array[0]}
              profile=${array[1]}
              target_path=${array[2]}
              tmp_filename=$(date +%s).yaml
              echo "subscribe_link: $subscribe_link"
              echo "target_path: $target_path"
              echo "tmp_filename: $tmp_filename"
              node convert.js $url ./dist/$tmp_filename
              aws --profile $profile s3 cp ./dist/$tmp_filename $target_path
          done
        env:
          SUBCONVERTER_HOST: localhost
          SUBCONVERTER_PORT: 25500