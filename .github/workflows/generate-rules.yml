name: Generate clash rules(mixed)
run-name: ${{ github.actor }} is trigger generation 🚀
on: 
  push:
  schedule:
    - cron: '0 */1 * * *'
jobs:
  generate-clash-rules:
    runs-on: ubuntu-latest
    services:
      subconverter:
        image: tindy2013/subconverter:0.8.1
        ports:
          # Opens tcp port 6379 on the host and service container
          - 25500:25500
        options: >-
          --health-cmd "nc -v -z -w 5 127.0.0.1 25500"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Setup AWS Cli Action
        uses: warjiang/setup-awscli-action@v0.1.1
      - name: Setup AWS config
        run: |
          mkdir -p ~/.aws
          echo "${{ vars.AWS_CREDENTIALS }}" > ~/.aws/credentials
          echo "${{ vars.AWS_CONFIG }}" > ~/.aws/config
          mkdir -p dist
      - name: Test Aws config
        run: |
          aws --version
          aws --profile stardream s3 ls
          aws --profile qiniu s3 ls
      - name: Install dependencies
        run: npm ci
      - name: Generate rules
        run: |
          node convert.js 'https://jjsubmarines.com/members/getsub.php?service=504873&id=1d8efeb0-46fa-4c06-8d2e-631c551112f2' './dist/clash-3f969236-d760-428d-8f00-06e0465e879a.yaml'
          node convert.js 'https://s.trojanflare.com/subscription/shadowrocket/632982f8-2eef-48ff-a5ac-e2a9b7df9c03' './dist/clash-b071df03-563e-48d7-9d25-0308f96e5ab2.yaml'
        env:
          SUBCONVERTER_HOST: localhost
          SUBCONVERTER_PORT: 25500
      - name: Upload rules
        run: |
          aws --profile stardream s3 cp ./dist/clash-b071df03-563e-48d7-9d25-0308f96e5ab2.yaml s3://stardream-link-static/clash/clash-b071df03-563e-48d7-9d25-0308f96e5ab2.yaml
          aws --profile qiniu s3 cp ./dist/clash-3f969236-d760-428d-8f00-06e0465e879a.yaml s3://savemoney/clash/clash-3f969236-d760-428d-8f00-06e0465e879a.yaml