name: Generate justmysocks-clash rules
run-name: ${{ github.actor }} is trigger generation 🚀
on:
  workflow_dispatch:
jobs:
  generate-clash-rules:
    runs-on: ubuntu-latest
    services:
      subconverter:
        image: tindy2013/subconverter:0.8.1
        ports:
          # Opens tcp port 6379 on the host and service container
          - 25500:25500
        options: >-
          --health-cmd "nc -v -z -w 5 127.0.0.1 25500"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Setup AWS CLI Action
        uses: warjiang/setup-awscli-action@v0.1.1
      - name: Setup AWS config
        run: |
          mkdir -p ~/.aws
          echo "${{ secrets.AWS_CREDENTIALS }}" > ~/.aws/credentials
          echo "${{ secrets.AWS_CONFIG }}" > ~/.aws/config
          mkdir -p dist
      - name: Test AWS config
        run: |
          aws --version
          aws --profile qiniu s3 ls
      - name: Install dependencies
        run: npm ci
      - name: Generate And Upload Rules
        run: |
          SHELL_FOLDER=$(pwd)
          SUBSCRIBE_LINK="${{ secrets.JUSTMYSOCKS_SUBSCRIBE_LINK }}"
          IFS='#' read -r -a array <<< "$SUBSCRIBE_LINK"
          subscribe_link=${array[0]}
          profile=${array[1]}
          target_path=${array[2]}
          cdn_prefix=${array[3]}
          if [ -z "$cdn_prefix" ]; then
            echo "cdn_prefix is not set in SUBSCRIBE_LINK config (expected format: subscribe_link#profile#s3://bucket/object_key#https://cdn_prefix/)"
            exit 1
          fi
          tmp_filename=$(date +%s).yaml
          node convert.js "$subscribe_link" "./dist/$tmp_filename"
          aws --profile "$profile" s3 cp --acl public-read "./dist/$tmp_filename" "$target_path"
          # Derive object key from s3://bucket/key and tolerate trailing slash target paths
          normalized_target_path=$(printf '%s' "$target_path" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
          if [[ "$normalized_target_path" == *"'"* || "$normalized_target_path" == *'"'* ]]; then
            echo "target_path must not contain quote characters: $normalized_target_path"
            exit 1
          fi
          if [[ "$normalized_target_path" == s3://* ]]; then
            object_key=${normalized_target_path#s3://}
            object_key=${object_key#*/}
          else
            object_key=$normalized_target_path
          fi
          if [ -z "$object_key" ] || [ "$object_key" = "/" ]; then
            echo "Could not derive a valid object key from target_path: $normalized_target_path"
            exit 1
          fi
          if [[ "$object_key" == */ ]]; then
            object_key="${object_key}${tmp_filename}"
          fi
          cdn_url="${cdn_prefix%/}/${object_key}"
          node refresh.js "$cdn_url"
        env:
          SUBCONVERTER_HOST: localhost
          SUBCONVERTER_PORT: 25500
          QINIU_ACCESS_KEY: ${{ secrets.QINIU_ACCESS_KEY }}
          QINIU_SECRET_KEY: ${{ secrets.QINIU_SECRET_KEY }}
